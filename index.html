<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10110f">
  <meta name="description" content="A quiet personal launch point.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%2310110f'/%3E%3Cpath d='M8 43 20 29l9 8 14-18 13 13' fill='none' stroke='%23b7ff62' stroke-width='4'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <title>Signal / home</title>
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <a class="wordmark" href="./" aria-label="Return to home">SIGNAL<span>/</span>HOME</a>
      <p class="topbar-meta">PERSONAL LAUNCH POINT <span aria-hidden="true">·</span> 01</p>
    </header>

    <main>
      <section class="hero" aria-labelledby="welcome-heading">
        <canvas class="signal-canvas" id="signal-canvas" aria-hidden="true"></canvas>
        <div class="hero-content">
          <p class="eyebrow">LOCAL TIME <span aria-hidden="true">//</span> READY</p>
          <h1 id="welcome-heading" class="clock" aria-label="Current time">--:--</h1>
          <div class="date-row">
            <p id="date" class="date">Loading date</p>
            <p class="status"><span class="status-dot" aria-hidden="true"></span> ALL SYSTEMS QUIET</p>
          </div>
        </div>
        <p class="hero-caption">A small place to begin.<br>Move carefully. Notice everything.</p>
      </section>

      <section class="launch-section" aria-labelledby="launch-heading">
        <div class="section-heading">
          <p class="eyebrow">FREQUENT DESTINATIONS</p>
          <h2 id="launch-heading">Launch</h2>
        </div>
        <nav class="launch-grid" aria-label="Frequent destinations">
          <a class="launch-link" href="https://github.com/" target="_blank" rel="noreferrer">
            <span class="link-index">01</span>
            <span class="link-name">GitHub</span>
            <span class="link-arrow" aria-hidden="true">↗</span>
          </a>
          <a class="launch-link" href="https://quantnet.com" target="_blank" rel="noreferrer">
            <span class="link-index">02</span>
            <span class="link-name">Quant Net</span>
            <span class="link-arrow" aria-hidden="true">↗</span>
          </a>
          <a class="launch-link" href="https://quantsandbox.dev/" target="_blank" rel="noreferrer">
            <span class="link-index">03</span>
            <span class="link-name">Quant Sandbox</span>
            <span class="link-arrow" aria-hidden="true">↗</span>
          </a>
          <a class="launch-link" href="https://nuvio.tv" target="_blank" rel="noreferrer">
            <span class="link-index">04</span>
            <span class="link-name">Nuvio</span>
            <span class="link-arrow" aria-hidden="true">↗</span>
          </a>
        </nav>
      </section>
    </main>

    <footer class="footer">
      <p>OBSERVATION DECK <span aria-hidden="true">/</span> <span id="year">2026</span></p>
      <p class="footer-mark" aria-label="Signal is online"><span class="status-dot" aria-hidden="true"></span> ONLINE</p>
    </footer>
  </div>
  <script src="script.js"></script>
</body>
</html>
